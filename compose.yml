services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: html-analyzer-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=html_analyzer;Username=postgres;Password=postgres
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/src

  postgres:
    image: postgres:18
    container_name: html-analyzer-postgres
    environment:
      POSTGRES_DB: html_analyzer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d html_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: html-analyzer-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@html-analyzer.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      PGPASS_FILE: /run/secrets/pgpass
    ports:
      - "8080:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    secrets:
      - pgpass

volumes:
  postgres-data:
  pgadmin-data:

secrets:
  pgpass:
    file: ./docker/pgadmin/pgpass
